# Checks every link on the site once a month and opens an issue when one has died.
# Copy this file to .github/workflows/links.yml in your repository.
#
# It builds the site first so it sees the links exactly as visitors do. Change the
# build commands and the folder (out/) to match your project.

name: Check links

on:
  schedule:
    - cron: "17 9 1 * *" # the 1st of every month, 09:17 UTC
  workflow_dispatch: # and whenever you press "Run workflow"

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      - name: Check the links
        id: check
        run: |
          npx --yes still-there@1 out --markdown > report.md && echo "dead=false" >> "$GITHUB_OUTPUT" || echo "dead=true" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.check.outputs.dead == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dead-links --color B43B2B --description "Links that stopped working" --force
          open=$(gh issue list --label dead-links --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Dead links found" --label dead-links --body-file report.md
          fi
